# ---------------------------------------------------------------------------
# The backend image ships Node (for `npx @playwright/mcp`), Python, and the
# Playwright browser binaries, because in stdio mode the MCP server is a child
# process of the backend. Switch MCP_TRANSPORT=http and uncomment the `mcp`
# service to run the browser in its own container instead.
# ---------------------------------------------------------------------------
services:
  # The application's own database. A named schema inside it (DB_SCHEMA) means
  # this can just as easily be an existing Postgres shared with other systems.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed so `make db-upgrade` and psql work from the host. Drop this
      # line in any deployment where the database should not be reachable
      # from outside the compose network.
      - "5432:5432"
    healthcheck:
      # The backend's `depends_on` waits for this, so migrations never race
      # a database that is still starting up.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      ARTIFACTS_DIR: /app/artifacts
      # Inside the compose network the database is reachable by service name,
      # which overrides whatever .env says for host-side tooling.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SCHEMA: ${DB_SCHEMA:-browser}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      # AWS credentials for Bedrock. These pass through from your shell when
      # set and are simply absent otherwise, so the same file works for local
      # keys, SSO, and an IAM task role (where none of them are needed).
      AWS_REGION: ${AWS_REGION:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations run before the server, in the same container that will serve
    # traffic -- so a deploy cannot start an app whose schema is behind.
    command: >-
      sh -c "python -m alembic upgrade head &&
             exec uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      # Read-only mount of the host AWS config, so profiles and SSO caches work
      # inside the container. Harmless when the directory does not exist, and
      # unnecessary when the host uses an IAM role -- comment it out then.
      - ~/.aws:/root/.aws:ro
    # Chromium needs a bigger /dev/shm than Docker's 64MB default or it will
    # crash on content-heavy pages.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional: run the Playwright MCP server as its own service.
  # Set MCP_TRANSPORT=http and MCP_SERVER_URL=http://mcp:8931/sse in .env.
  # mcp:
  #   image: mcr.microsoft.com/playwright:v1.49.0-noble
  #   command: npx -y @playwright/mcp@latest --port 8931 --host 0.0.0.0 --headless --isolated
  #   ports:
  #     - "8931:8931"
  #   shm_size: "1gb"

volumes:
  postgres-data:
