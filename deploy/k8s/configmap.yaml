# Everything that is not a secret. Passwords and CREDENTIALS_KEY live in the
# Secret this references by name; see deploy/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: browser-automation
  namespace: browser-automation
data:
  # --- database -------------------------------------------------------------
  # Aurora's writer endpoint. The application keeps its tables in a named
  # schema so it can share a database with other systems without colliding.
  DB_HOST: "browser-automation.cluster-xxxxx.eu-west-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  DB_USER: "browser_automation"
  DB_SCHEMA: "browser"
  # Keep (pool_size + max_overflow) x replicas under Aurora's max_connections.
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "5"

  # --- browser --------------------------------------------------------------
  BROWSER_ENGINE: "chromium"
  BROWSER_HEADLESS: "true"
  # A trace per execution is a few MB. Worth it while a workflow is new;
  # turn it off once it is boring.
  BROWSER_TRACE: "false"

  # Recording needs a display and a pod has none. Also set in the image, and
  # repeated here so it is visible to whoever reads the config rather than
  # only to whoever reads the Dockerfile.
  RECORDER_ENABLED: "false"

  # --- artifacts ------------------------------------------------------------
  # Screenshots and traces go to S3 and are served by presigned redirect, so
  # the bytes go straight from S3 to the browser rather than through a pod.
  STORAGE_BACKEND: "s3"
  S3_BUCKET: "browser-automation-artifacts"
  S3_PREFIX: "artifacts"

  # --- model ----------------------------------------------------------------
  AWS_REGION: "eu-west-1"
  LLM_REPAIR_MODEL: "us.anthropic.claude-opus-5"
  EMBEDDING_BACKEND: "bedrock"
  EMBEDDING_MODEL: "amazon.titan-embed-text-v2:0"

  # Healing is the one thing here that costs tokens, and it is off by default:
  # a broken selector must not quietly turn a free batch into an expensive one.
  # Turn it on deliberately, per deployment.
  REPLAY_HEALING_ENABLED: "false"
  HEALING_MEMORY_ENABLED: "true"

  # --- replay ---------------------------------------------------------------
  # One screenshot per row. "every_step" multiplies that by the step count,
  # which over a thousand-row batch is gigabytes.
  REPLAY_SCREENSHOTS: "final"
  REPLAY_STEP_TIMEOUT: "30"
  REPLAY_FAILURE_STREAK_LIMIT: "5"

  LOG_LEVEL: "INFO"
  # Pods are ephemeral; logs belong in the cluster's collector, not on a disk
  # that disappears with the pod.
  LOG_TO_FILE: "false"
