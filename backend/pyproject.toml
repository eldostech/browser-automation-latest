[project]
name = "browser-agent-backend"
version = "0.1.0"
description = "FastAPI backend that drives a real browser through the Playwright MCP server with an LLM agent loop."
requires-python = ">=3.11"
readme = "../README.md"

# The runtime dependency list lives in requirements.txt so that `pip install -r`
# and Docker builds share one source of truth. This table mirrors it.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<0.1",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "mcp>=1.9,<2.0",
  "anthropic[bedrock]>=0.125,<1.0",
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
# The backend is a flat module tree (agent.py, mcp_client.py, ...) rather than
# an installed package, so tests import it by adding this directory to the path.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  # The description was left over from the retired MCP design: the e2e tests
  # drive Playwright directly, which is the whole point of them.
  "e2e: records and replays against a real Chromium (set RUN_E2E=1)",
  "mcp: drives a real `npx @playwright/mcp` server (set RUN_MCP=1)",
  # Off by default because it spends money. No test should be able to bill
  # somebody by being run.
  "llm: calls a real Bedrock model (set RUN_LLM=1 -- this costs a few cents)",
  # Not a pass/fail test so much as a measurement, and it runs every case
  # several times against a real browser. Separate from `e2e` because the two
  # answer different questions: e2e asks "is this correct", eval asks "how
  # often", and only the second one can tell you whether a change helped.
  "eval: measures accuracy and run-to-run variance (set RUN_EVAL=1)",
]
filterwarnings = ["ignore::DeprecationWarning"]
