# Alembic configuration.
#
# There is no sqlalchemy.url here, and that is deliberate: migrations/env.py
# builds the URL from the same Settings object the application uses. A URL in
# this file is a second source of truth that drifts, and the day it drifts is
# the day a migration runs against the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Filenames sort chronologically, which makes `ls versions/` a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
